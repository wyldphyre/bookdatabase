{% extends "base.html" %}

{% block title %}Statistics - Book Database{% endblock %}

{% block page_heading %}Statistics{% endblock %}

{% block content %}
<nav class="filter-tabs stats-tabs" aria-label="Statistics sections">
    {% for key, label in tabs %}
    <a href="{{ url_for('search.statistics', tab=None if key == 'overview' else key) }}"
       class="filter-btn{% if key == tab %} active{% endif %}"{% if key == tab %} aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>

<script src="{{ url_for('static', filename='vendor/chart-4.6.1.umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/statistics.js') }}"></script>

{% include 'statistics/' ~ tab ~ '.html' %}
{% endblock %}
