services:
  bookdatabase:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - ./data/instance:/app/instance
      - ./data/uploads:/app/static/uploads
    environment:
      - SECRET_KEY=${SECRET_KEY:-}
      - PUSHOVER_USER_KEY=${PUSHOVER_USER_KEY:-}
      - PUSHOVER_APP_TOKEN=${PUSHOVER_APP_TOKEN:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
